name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  hello-agent:

    name: Hello Agent Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/beginner/hello-agent

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Development Tools
        run: |
          pip install pytest ruff

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Tests
        run: |
          pytest -v