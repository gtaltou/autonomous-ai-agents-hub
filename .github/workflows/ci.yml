name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  hello-agent:

    name: Hello Agent

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/beginner/hello-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          python -m ruff check .

      - name: Tests
        run: |
          pytest -v

