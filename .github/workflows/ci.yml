name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main

jobs:

  hello-agent:
    name: Hello Agent
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/beginner/hello-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -v

  tool-calling:
    name: Tool Calling
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/beginner/tool-calling

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -v

  structured-output:
    name: Structured Output
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/beginner/structured-output

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -v

  evaluation:
    name: Evaluation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/beginner/evaluation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -v

  knowledge-worker:
    name: Knowledge Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/knowledge-worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy app

      - name: Tests with Coverage
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term

      - name: Build Docker Image
        run: docker build -t knowledge-worker .

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-worker-coverage
          path: projects/knowledge-worker/coverage.xml

  rag-assistant:
    name: RAG Assistant
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/rag-assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy app

      - name: Tests with Coverage
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: rag-assistant-coverage
          path: projects/rag-assistant/coverage.xml

  quality-gate:
    name: Quality Gate

    needs:
      - hello-agent
      - tool-calling
      - structured-output
      - evaluation
      - knowledge-worker
      - rag-assistant

    runs-on: ubuntu-latest

    steps:
      - name: Quality Gate Passed
        run: |
          echo "All validation pipelines succeeded."